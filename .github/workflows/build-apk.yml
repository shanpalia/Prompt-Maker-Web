name: Build Prompt Maker APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "capacitor.config.ts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web dependencies
        run: npm install
      - name: Export web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Prepare branded Android assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/icon.svg > assets/icon.png
          rsvg-convert -w 1366 -h 2732 assets/splash.svg > assets/splash.png
      - name: Generate native icon and splash assets
        run: npx capacitor-assets generate --android
      - name: Verify native splash assets exist
        run: |
          find android/app/src/main/res -type f | sort
          find android/app/src/main/res -type f | grep -E 'splash|launch' 
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Verify splash plugin is installed
        run: |
          grep -R "capacitor-splash-screen" -n android/capacitor.settings.gradle android/app/capacitor.build.gradle || true
          find android/app/src/main/res -type f | grep -E 'splash|launch'
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Maker-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

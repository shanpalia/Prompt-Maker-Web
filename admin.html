<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#effbf5"><title>Admin — Prompt Maker</title>
<style>
:root{--green:#147d53;--ink:#172b24;--muted:#718179;--line:#e5eee8}*{box-sizing:border-box}body{margin:0;background:#f7fbf8;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:850px;margin:35px auto;padding:0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0}.brand{font-size:24px;font-weight:850}.brand em{font-style:normal;color:var(--green)}p,.hint{color:var(--muted)}label{display:grid;gap:6px;font-weight:700;font-size:13px;margin:13px 0}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:white;font:inherit;font-weight:750;cursor:pointer;margin:4px 4px 4px 0}.secondary{background:#e6f7ec;color:var(--green)}.danger{background:#fff0ef;color:#b63c36}.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.status{font-size:13px;min-height:22px;overflow-wrap:anywhere}.hidden{display:none!important}a{color:var(--green)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="./firebase-config.js"></script></head>
<body><main class="wrap"><div class="brand">Prompt <em>Maker</em> · Admin</div><p>Admin access requires a document at <code>admins/{your Firebase Auth UID}</code> in Cloud Firestore.</p>
<section class="panel" id="loginPanel"><h2>Admin sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section>
<section class="panel hidden" id="editor"><div><b id="identity"></b> <button class="secondary" id="logout" type="button">Sign out</button></div><h2 id="formTitle">Add prompt</h2><form id="promptForm"><label>Title<input id="title" required maxlength="100"></label><label>Category<select id="category"><option>Portrait</option><option>Cinematic</option><option>Couple</option><option>Anime</option><option>Festival</option><option>Landscape</option><option>Car</option><option>Other</option></select></label><label>Prompt text<textarea id="promptText" rows="6" required minlength="10"></textarea></label><label>Preview image URL (optional)<input id="imageUrl" type="url"></label><label><input id="published" type="checkbox" checked style="width:auto"> Published on homepage</label><button id="saveBtn">Save prompt</button><button class="secondary" id="cancelEdit" type="button">Cancel edit</button></form><h2>Manage prompts</h2><div id="items"></div></section><p id="status" class="status" role="status"></p><a href="./index.html">← Homepage</a> · <a href="./users.html">User login</a></main>
<script>
const $=id=>document.getElementById(id);let editId=null,allowed=false;
function say(s){$("status").textContent=s}
function resetForm(){editId=null;$("promptForm").reset();$("published").checked=true;$("formTitle").textContent="Add prompt";$("saveBtn").textContent="Save prompt"}
async function checkAdmin(user){if(!user){allowed=false;$("loginPanel").classList.remove("hidden");$("editor").classList.add("hidden");say("");return}if((user.email||"").toLowerCase()!=="shanpalia786@gmail.com"){allowed=false;$("loginPanel").classList.remove("hidden");$("editor").classList.add("hidden");say("Access denied: sign in with the authorized admin email.");return}allowed=true;$("loginPanel").classList.add("hidden");$("editor").classList.remove("hidden");$("identity").textContent=(user.email||"")+" · Admin";say("");await loadItems()}
async function loadItems(){if(!allowed)return;try{const snap=await db.collection("prompts").orderBy("created_at","desc").get();$("items").innerHTML="";if(snap.empty){$("items").textContent="No prompts yet.";return}snap.forEach(doc=>{const p=doc.data(),el=document.createElement("div");el.className="item";const info=document.createElement("div"),title=document.createElement("b"),meta=document.createElement("div");title.textContent=p.title||"Untitled";meta.className="hint";meta.textContent=(p.category||"Other")+" · "+(p.status||"draft");info.append(title,meta);const actions=document.createElement("div"),edit=document.createElement("button"),toggle=document.createElement("button"),del=document.createElement("button");edit.textContent="Edit";toggle.textContent=p.status==="published"?"Unpublish":"Publish";toggle.className="secondary";del.textContent="Delete";del.className="danger";edit.onclick=()=>{editId=doc.id;$("formTitle").textContent="Edit prompt";$("title").value=p.title||"";$("category").value=p.category||"Other";$("promptText").value=p.prompt_text||"";$("imageUrl").value=p.image_url||"";$("published").checked=p.status==="published";$("saveBtn").textContent="Save changes";window.scrollTo({top:0,behavior:"smooth"})};toggle.onclick=async()=>{try{const status=p.status==="published"?"draft":"published";await db.collection("prompts").doc(doc.id).update({status,published_at:status==="published"?firebase.firestore.FieldValue.serverTimestamp():null});await loadItems();say("Prompt status updated.")}catch(e){say(e.message)}};del.onclick=async()=>{if(!confirm("Permanently delete this prompt?"))return;try{await db.collection("prompts").doc(doc.id).delete();await loadItems();say("Prompt deleted.")}catch(e){say(e.message)}};actions.append(edit,toggle,del);el.append(info,actions);$("items").append(el)})}catch(e){say("Could not load prompts: "+e.message)}}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);say("Checking admin access…")}catch(e){say(e.message)}};
$("logout").onclick=()=>auth.signOut();$("cancelEdit").onclick=resetForm;
$("promptForm").onsubmit=async e=>{e.preventDefault();if(!allowed)return say("Admin access required.");$("saveBtn").disabled=true;const published=$("published").checked,payload={title:$("title").value.trim(),category:$("category").value,prompt_text:$("promptText").value.trim(),image_url:$("imageUrl").value.trim()||null,status:published?"published":"draft",published_at:published?firebase.firestore.FieldValue.serverTimestamp():null,updated_at:firebase.firestore.FieldValue.serverTimestamp()};try{if(editId)await db.collection("prompts").doc(editId).update(payload);else await db.collection("prompts").add({...payload,created_at:firebase.firestore.FieldValue.serverTimestamp()});resetForm();say("Prompt saved.");await loadItems()}catch(e){say("Save failed: "+e.message)}finally{$("saveBtn").disabled=false}};
auth.onAuthStateChanged(checkAdmin);
</script></body></html>

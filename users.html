<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#effbf5"><title>User Login — Prompt Maker</title>
<style>
:root{--green:#147d53;--ink:#172b24;--muted:#718179;--line:#e5eee8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f7fbf8;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 14px 45px #173d2810}.brand{font-size:22px;font-weight:850}.brand em{font-style:normal;color:var(--green)}p{color:var(--muted)}label{display:grid;gap:6px;font-weight:700;font-size:13px;margin:14px 0}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit}button{border:0;border-radius:11px;padding:12px 15px;background:var(--green);color:#fff;font:inherit;font-weight:750;cursor:pointer;width:100%;margin-top:10px}button:disabled{opacity:.65;cursor:wait}.secondary{background:#e6f7ec;color:var(--green)}.google{background:#fff;color:#26352d;border:1px solid var(--line)}a{color:var(--green)}#status{overflow-wrap:anywhere;font-size:13px;min-height:22px}.links{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:18px}.hidden{display:none!important}.divider{text-align:center;font-size:12px;color:var(--muted);margin:14px 0}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="./firebase-config.js"></script></head>
<body><main class="card"><div class="brand">Prompt <em>Maker</em></div><p>Sign in or create your PaliaAPK HUB account.</p>
<button class="google" id="googleBtn" type="button">Continue with Google</button><div class="divider">OR CONTINUE WITH EMAIL</div>
<form id="authForm"><label>Email address<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" minlength="6" autocomplete="current-password" required></label><button id="submitBtn" type="submit">Sign in</button></form>
<button class="secondary" id="toggleBtn" type="button">Create a new account</button><button class="secondary" id="resetBtn" type="button">Forgot password?</button><button class="secondary hidden" id="signoutBtn" type="button" hidden>Sign out</button><p id="status" role="status"></p>
<div class="links"><a href="./index.html">← Browse prompts</a><a href="./admin.html">Admin</a></div></main>
<script>
let signup=false;const $=id=>document.getElementById(id);
function say(s){$("status").textContent=s}
$("toggleBtn").onclick=()=>{signup=!signup;$("submitBtn").textContent=signup?"Create account":"Sign in";$("toggleBtn").textContent=signup?"I already have an account":"Create a new account";$("password").autocomplete=signup?"new-password":"current-password";$("resetBtn").classList.toggle("hidden",signup);say("")};
$("authForm").addEventListener("submit",async e=>{e.preventDefault();$("submitBtn").disabled=true;say("Please wait…");try{const email=$("email").value.trim(),password=$("password").value;const result=signup?await auth.createUserWithEmailAndPassword(email,password):await auth.signInWithEmailAndPassword(email,password);say("Signed in as "+(result.user.email||"Google user")+". Redirecting…");location.href="./index.html"}catch(err){say(err.message||"Authentication failed.")}finally{$("submitBtn").disabled=false}});
$("googleBtn").onclick=async()=>{try{const provider=new firebase.auth.GoogleAuthProvider();const result=await auth.signInWithPopup(provider);say("Signed in with Google. Redirecting…");location.href="./index.html"}catch(e){if(e.code==="auth/popup-closed-by-user")say("Google sign-in was cancelled.");else if(e.code==="auth/unauthorized-domain")say("This website domain is not authorized in Firebase Authentication settings.");else say(e.message||"Google sign-in failed.")}};
$("resetBtn").onclick=async()=>{const email=$("email").value.trim();if(!email){say("Enter your email address first, then choose Forgot password.");$("email").focus();return}try{await auth.sendPasswordResetEmail(email);say("Password reset email sent. Check your inbox and spam folder.")}catch(e){say(e.message||"Could not send reset email.")}};
$("signoutBtn").onclick=async()=>{await auth.signOut();say("Signed out.")};
auth.onAuthStateChanged(user=>{if(user){$("status").textContent="Signed in as "+(user.email||"Google user");$("signoutBtn").hidden=false}else $("signoutBtn").hidden=true});
</script></body></html>
